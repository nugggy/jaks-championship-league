name: Build and release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ${PKG}"; exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.JCL_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "JCL_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "JCL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          JCL_KEYSTORE_PASSWORD: ${{ secrets.JCL_KEYSTORE_PASSWORD }}
          JCL_KEY_PASSWORD: ${{ secrets.JCL_KEYSTORE_PASSWORD }}
          JCL_KEY_ALIAS: jcl
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/jaks-championship-league.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then NOTES="$(cat "$NOTES_FILE")"; else NOTES="Jak's Championship League ${GITHUB_REF_NAME}"; fi
          gh release create "${GITHUB_REF_NAME}" jaks-championship-league.apk \
            --title "Jak's Championship League ${GITHUB_REF_NAME}" \
            --notes "$NOTES"

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaks-championship-league
          path: jaks-championship-league.apk
